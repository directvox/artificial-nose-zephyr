name: Build Zephyr Firmware for Wio Terminal

on:
  push:
    branches: [zephyr-v4.1.0-upgrade]
  pull_request:
    branches: [zephyr-v4.1.0-upgrade]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      ZEPHYR_SDK_INSTALL_DIR: /opt/toolchains/zephyr-sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip cmake ninja-build gperf ccache dfu-util device-tree-compiler wget \
                                  python3-dev python3-setuptools python3-tk python3-wheel xz-utils file \
                                  make gcc g++ python3-ply python3-yaml

      - name: Install west and requirements
        run: |
          python3 -m pip install --upgrade pip
          pip3 install west
          west --version

      - name: Init and update west modules
        run: |
          west init -l .
          west update
          west zephyr-export

      - name: Install Zephyr SDK
        run: |
          wget https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.4/zephyr-sdk-0.16.4_linux-x86_64.tar.xz
          tar xvf zephyr-sdk-0.16.4_linux-x86_64.tar.xz
          sudo mv zephyr-sdk-0.16.4 /opt/toolchains/zephyr-sdk
          /opt/toolchains/zephyr-sdk/setup.sh -t all -h

      - name: Build firmware for Wio Terminal
        run: |
          west build -b seeed_wio_terminal app/src

      - name: Archive firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/zephyr/zephyr.* # Adjust if your output is elsewhere
